<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆简谐振动模拟器</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a24;
    overflow: hidden;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");

  var BG = "#1a1a24";
  var L = 200;
  var G = 9.8;
  var PIXELS_PER_METER = 100;
  var THETA0 = Math.PI / 4;
  var BOB_R = 18;

  var Lm = L / PIXELS_PER_METER;
  var K = G / Lm;

  var theta = THETA0;
  var omega = 0;

  var width = 0, height = 0, dpr = 1;
  var cx = 0, cy = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = width / 2;
    cy = Math.min(height * 0.30, height - L - 90);
    if (cy < L + 40) cy = Math.max(height * 0.12, 60);
  }
  window.addEventListener("resize", resize);
  resize();

  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = "rgba(120, 150, 200, 0.05)";
    ctx.lineWidth = 1;
    var gap = 40;
    for (var x = 0; x <= width; x += gap) {
      ctx.beginPath();
      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, height);
      ctx.stroke();
    }
    for (var y = 0; y <= height; y += gap) {
      ctx.beginPath();
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(width, y + 0.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPivot(x, y) {
    ctx.save();
    ctx.fillStyle = "#2b2b3d";
    ctx.beginPath();
    ctx.arc(x, y, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(120, 180, 240, 0.55)";
    ctx.stroke();
    ctx.fillStyle = "#8fc7ff";
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawEnvelope() {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, L, Math.PI / 2 - THETA0, Math.PI / 2 + THETA0);
    ctx.strokeStyle = "rgba(120, 180, 240, 0.10)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 8]);
    ctx.stroke();
    ctx.restore();
  }

  function drawString(bx, by) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(bx, by);
    ctx.strokeStyle = "rgba(200, 220, 255, 0.75)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawBob(bx, by) {
    ctx.save();

    var glow = ctx.createRadialGradient(bx, by, 2, bx, by, BOB_R * 3.2);
    glow.addColorStop(0, "rgba(90, 200, 255, 0.55)");
    glow.addColorStop(0.35, "rgba(90, 200, 255, 0.20)");
    glow.addColorStop(1, "rgba(90, 200, 255, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(bx, by, BOB_R * 3.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowColor = "rgba(90, 200, 255, 0.9)";
    ctx.shadowBlur = 22;

    var body = ctx.createRadialGradient(
      bx - BOB_R * 0.35, by - BOB_R * 0.35, 1,
      bx, by, BOB_R
    );
    body.addColorStop(0, "#ffffff");
    body.addColorStop(0.45, "#a9e4ff");
    body.addColorStop(1, "#2f9fd6");
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(bx, by, BOB_R, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawHud(bx, by) {
    var deg = (theta * 180 / Math.PI);
    ctx.save();
    ctx.fillStyle = "rgba(200, 220, 255, 0.85)";
    ctx.font = "14px Consolas, Menlo, monospace";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("单摆简谐振动模拟器", 24, 22);
    ctx.fillStyle = "rgba(140, 170, 210, 0.85)";
    ctx.font = "13px Consolas, Menlo, monospace";
    ctx.fillText("L = " + L + " px", 24, 48);
    ctx.fillText("g = " + G + " m/s^2", 24, 68);
    ctx.fillText("θ = " + deg.toFixed(1) + "°", 24, 88);

    ctx.textAlign = "right";
    ctx.fillStyle = "rgba(140, 170, 210, 0.6)";
    ctx.fillText("ω = " + omega.toFixed(2) + " rad/s", width - 24, 48);
    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, width, height);

    drawGrid();
    drawEnvelope();

    var bx = cx + L * Math.sin(theta);
    var by = cy + L * Math.cos(theta);

    drawString(bx, by);
    drawBob(bx, by);
    drawPivot(cx, cy);
    drawHud(bx, by);
  }

  var STEP = 1 / 240;
  var acc = 0;
  var last = performance.now();

  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    acc += dt;

    while (acc >= STEP) {
      var alpha = -K * Math.sin(theta);
      omega += alpha * STEP;
      theta += omega * STEP;
      acc -= STEP;
    }

    draw();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
